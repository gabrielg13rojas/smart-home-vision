# ==========================================================
#  SMART HOME VISION - configuracion
# ==========================================================
server.port=8080
spring.application.name=smart-home-vision
# Sin cache para HTML/CSS/JS: los cambios se ven al recargar la pagina
spring.web.resources.cache.cachecontrol.no-cache=true

# Carpeta local para usuarios (users.json) y modelos de OpenCV (models/)
app.data-dir=data

# ---------------- Reconocimiento facial (OpenCV YuNet + SFace)
# Similitud coseno minima para considerar que un rostro es el mismo usuario.
# 0.363 es el valor recomendado por OpenCV. Sube a 0.45 si confunde personas,
# baja a 0.30 si no te reconoce.
app.face.match-threshold=0.363
# Confianza minima del detector de rostros (0..1)
app.face.detection-score=0.8
# Tiempo (ms) que la autorizacion sigue activa si el rostro deja de verse
app.face.auth-timeout-ms=2000

# ---------------- Gestos
# Tiempo (ms) que hay que mantener un gesto para que se ejecute
app.gesture.hold-ms=700
# Tiempo (ms) que la mano debe desaparecer para poder repetir el MISMO gesto
# (por ejemplo, ☝️ para encender y otra vez ☝️ para apagar)
app.gesture.release-ms=600
# Cortes de deteccion mas cortos que esto (ms) no reinician el conteo del gesto
app.gesture.grace-ms=300

# ---------------- Arduino (puerto serial USB)
# arduino.port: "auto" para detectarlo, o el nombre exacto: COM3 (Windows),
# /dev/ttyUSB0 o /dev/ttyACM0 (Linux), /dev/cu.usbmodem1101 (macOS)
arduino.enabled=true
arduino.port=auto
arduino.baud-rate=9600

# ---------------- Modelos ONNX (se descargan solos la primera vez a data/models)
app.models.yunet-url=https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
app.models.sface-url=https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
