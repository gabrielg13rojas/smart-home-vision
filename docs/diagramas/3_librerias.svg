<text x="94" y="1034" font-size="20" fill="#495057">Navegador · JavaScript</text>
<rect x="364" y="1015" width="24" height="24" rx="5" fill="#0d6efd"/>
<text x="398" y="1034" font-size="20" fill="#495057">Servidor · Java</text>
<rect x="598" y="1015" width="24" height="24" rx="5" fill="#6f42c1"/>
<text x="632" y="1034" font-size="20" fill="#495057">Modelo dentro de OpenCV</text>
<rect x="912" y="1015" width="24" height="24" rx="5" fill="#fd7e14"/>
<text x="946" y="1034" font-size="20" fill="#495057">Placa Arduino Uno · C++</text>
