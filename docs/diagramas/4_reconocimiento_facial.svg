<text x="1052" y="782" font-size="21" font-weight="700" fill="#212529">Registrarse = guardar números.</text>
<text x="1052" y="809" font-size="18" fill="#495057">5 vectores de 128 números en users.json; las fotos se descartan.</text>
<circle cx="1032" cy="837" r="7" fill="#0d6efd"/>
<text x="1052" y="844" font-size="21" font-weight="700" fill="#212529">Ningún número es "la nariz".</text>
<text x="1052" y="871" font-size="18" fill="#495057">La red aprendió sola a poner cerca las fotos de la misma persona.</text>
<circle cx="1032" cy="899" r="7" fill="#0d6efd"/>
<text x="1052" y="906" font-size="21" font-weight="700" fill="#212529">El % en pantalla es un indicador.</text>
<text x="1052" y="933" font-size="18" fill="#495057">Umbral 0,363 = 60 %; similitud 0,7 = 100 %. No es una métrica biométrica.</text>
<circle cx="1032" cy="961" r="7" fill="#0d6efd"/>
<text x="1052" y="968" font-size="21" font-weight="700" fill="#212529">Sigue siendo un dato biométrico.</text>
<text x="1052" y="995" font-size="18" fill="#495057">No es una foto, pero te identifica: protégelo y permite borrarlo.</text>
