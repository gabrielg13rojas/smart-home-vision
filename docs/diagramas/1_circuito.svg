<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8">
      <circle cx="5" cy="5" r="4" fill="#212529"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="80" y="90" font-size="48" font-weight="700" fill="#212529">Conexiones · Arduino Uno</text>
  <text x="80" y="135" font-size="24" fill="#6c757d">3 LEDs de colores + módulo relé para el foco de 220V · GND común para todo</text>

  <!-- ===================== ARDUINO UNO ===================== -->
  <rect x="100" y="210" width="460" height="640" rx="28" fill="#00878F"/>
  <rect x="120" y="230" width="420" height="600" rx="20" fill="none" stroke="#5fc4c9" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="300" y="300" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">ARDUINO</text>
  <text x="300" y="342" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle">UNO</text>
  <!-- chip -->
  <rect x="200" y="440" width="170" height="90" rx="6" fill="#1b2a2f"/>
  <text x="285" y="492" font-size="18" fill="#cfd8dc" text-anchor="middle">ATmega328P</text>
  <!-- USB -->
  <rect x="62" y="560" width="70" height="110" rx="8" fill="#adb5bd" stroke="#6c757d" stroke-width="2"/>
  <text x="97" y="622" font-size="20" font-weight="700" fill="#212529" text-anchor="middle">USB</text>
  <text x="330" y="900" font-size="22" fill="#212529" text-anchor="middle">USB → computador</text>
  <text x="330" y="930" font-size="20" fill="#6c757d" text-anchor="middle">Spring Boot · serial 9600 baudios</text>

  <!-- Pines (lado derecho) -->
  <g font-size="24" font-weight="700" fill="#ffffff" text-anchor="end">
    <text x="520" y="318">D4</text>
    <text x="520" y="418">D5</text>
    <text x="520" y="518">D6</text>
    <text x="520" y="628">D7</text>
    <text x="520" y="718">5V</text>
    <text x="520" y="808">GND</text>
  </g>
  <g fill="#f8f9fa" stroke="#212529" stroke-width="2">
    <rect x="548" y="298" width="24" height="24" rx="3"/>
    <rect x="548" y="398" width="24" height="24" rx="3"/>
    <rect x="548" y="498" width="24" height="24" rx="3"/>
    <rect x="548" y="608" width="24" height="24" rx="3"/>
    <rect x="548" y="698" width="24" height="24" rx="3"/>
    <rect x="548" y="788" width="24" height="24" rx="3"/>
  </g>

  <!-- ===================== GND COMUN ===================== -->
  <line x1="1100" y1="270" x2="1100" y2="800" stroke="#212529" stroke-width="6" stroke-linecap="round"/>
  <text x="1100" y="250" font-size="22" font-weight="700" fill="#212529" text-anchor="middle">GND común</text>

  <!-- ===================== LEDs ===================== -->
  <!-- fila generica: pin -> resistencia -> LED -> GND -->
  <g stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="572" y1="310" x2="690" y2="310" stroke="#dc3545"/>
    <line x1="830" y1="310" x2="900" y2="310" stroke="#dc3545"/>
    <line x1="960" y1="310" x2="1100" y2="310" stroke="#212529"/>

    <line x1="572" y1="410" x2="690" y2="410" stroke="#198754"/>
    <line x1="830" y1="410" x2="900" y2="410" stroke="#198754"/>
    <line x1="960" y1="410" x2="1100" y2="410" stroke="#212529"/>

    <line x1="572" y1="510" x2="690" y2="510" stroke="#0d6efd"/>
    <line x1="830" y1="510" x2="900" y2="510" stroke="#0d6efd"/>
    <line x1="960" y1="510" x2="1100" y2="510" stroke="#212529"/>
  </g>
  <!-- uniones al GND -->
  <g fill="#212529"><circle cx="1100" cy="310" r="9"/><circle cx="1100" cy="410" r="9"/><circle cx="1100" cy="510" r="9"/><circle cx="1100" cy="800" r="9"/></g>

  <!-- resistencias 220 ohm -->
  <g>
    <rect x="690" y="292" width="140" height="36" rx="16" fill="#e9d8a6" stroke="#8a6d3b" stroke-width="2"/>
    <rect x="720" y="292" width="10" height="36" fill="#dc3545"/><rect x="745" y="292" width="10" height="36" fill="#dc3545"/><rect x="770" y="292" width="10" height="36" fill="#6f4e37"/><rect x="805" y="292" width="8" height="36" fill="#c9a227"/>
    <text x="760" y="280" font-size="20" fill="#6c757d" text-anchor="middle">220 Ω</text>

    <rect x="690" y="392" width="140" height="36" rx="16" fill="#e9d8a6" stroke="#8a6d3b" stroke-width="2"/>
    <rect x="720" y="392" width="10" height="36" fill="#dc3545"/><rect x="745" y="392" width="10" height="36" fill="#dc3545"/><rect x="770" y="392" width="10" height="36" fill="#6f4e37"/><rect x="805" y="392" width="8" height="36" fill="#c9a227"/>
    <text x="760" y="380" font-size="20" fill="#6c757d" text-anchor="middle">220 Ω</text>

    <rect x="690" y="492" width="140" height="36" rx="16" fill="#e9d8a6" stroke="#8a6d3b" stroke-width="2"/>
    <rect x="720" y="492" width="10" height="36" fill="#dc3545"/><rect x="745" y="492" width="10" height="36" fill="#dc3545"/><rect x="770" y="492" width="10" height="36" fill="#6f4e37"/><rect x="805" y="492" width="8" height="36" fill="#c9a227"/>
    <text x="760" y="480" font-size="20" fill="#6c757d" text-anchor="middle">220 Ω</text>
  </g>

  <!-- LEDs (simbolo diodo) -->
  <g filter="url(#glow)">
    <polygon points="900,286 900,334 956,310" fill="#dc3545"/>
    <polygon points="900,386 900,434 956,410" fill="#198754"/>
    <polygon points="900,486 900,534 956,510" fill="#0d6efd"/>
  </g>
  <g stroke="#212529" stroke-width="5">
    <line x1="958" y1="284" x2="958" y2="336"/>
    <line x1="958" y1="384" x2="958" y2="436"/>
    <line x1="958" y1="484" x2="958" y2="536"/>
  </g>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="930" y="272" fill="#dc3545">LED rojo</text>
    <text x="930" y="372" fill="#198754">LED verde</text>
    <text x="930" y="472" fill="#0d6efd">LED azul</text>
  </g>
  <text x="930" y="565" font-size="17" fill="#6c757d" text-anchor="middle">pata larga (+) ▶ │ pata corta (−)</text>

  <!-- ===================== D7, 5V, GND -> RELE ===================== -->
  <g stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="572" y1="620" x2="1230" y2="620" stroke="#fd7e14"/>
    <line x1="572" y1="710" x2="1230" y2="710" stroke="#dc3545"/>
    <line x1="572" y1="800" x2="1230" y2="800" stroke="#212529"/>
  </g>
  <g font-size="19" fill="#6c757d">
    <text x="600" y="606">señal del relé</text>
    <text x="600" y="696">alimentación 5 V</text>
    <text x="600" y="786">tierra</text>
  </g>

  <!-- modulo rele -->
  <rect x="1230" y="560" width="290" height="290" rx="16" fill="#cfe2ff" stroke="#0d6efd" stroke-width="3"/>
  <text x="1375" y="598" font-size="22" font-weight="800" fill="#0a58ca" text-anchor="middle">MÓDULO RELÉ 5V</text>
  <rect x="1320" y="660" width="110" height="110" rx="8" fill="#0d6efd"/>
  <text x="1375" y="722" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">RELÉ</text>
  <g font-size="20" font-weight="700" fill="#0a58ca">
    <text x="1244" y="627">IN</text>
    <text x="1244" y="717">VCC</text>
    <text x="1244" y="807">GND</text>
    <text x="1506" y="657" text-anchor="end">COM</text>
    <text x="1506" y="737" text-anchor="end">NO</text>
    <text x="1506" y="817" text-anchor="end" fill="#adb5bd">NC</text>
  </g>

  <!-- ===================== ZONA 220V ===================== -->
  <rect x="1560" y="470" width="330" height="440" rx="18" fill="#fff5f5" stroke="#dc3545" stroke-width="4" stroke-dasharray="14 10"/>
  <polygon points="1600,535 1625,490 1650,535" fill="#ffc107" stroke="#212529" stroke-width="2"/>
  <text x="1625" y="530" font-size="26" font-weight="900" fill="#212529" text-anchor="middle">!</text>
  <text x="1662" y="522" font-size="21" font-weight="800" fill="#dc3545">ALTA TENSIÓN 220V</text>

  <!-- enchufe -->
  <rect x="1760" y="560" width="110" height="80" rx="12" fill="#f8f9fa" stroke="#212529" stroke-width="3"/>
  <text x="1815" y="597" font-size="18" font-weight="700" fill="#212529" text-anchor="middle">ENCHUFE</text>
  <text x="1790" y="628" font-size="18" font-weight="700" fill="#dc3545" text-anchor="middle">L</text>
  <text x="1840" y="628" font-size="18" font-weight="700" fill="#0d6efd" text-anchor="middle">N</text>

  <!-- fase L -> COM -->
  <polyline points="1790,640 1790,650 1520,650" fill="none" stroke="#8b4513" stroke-width="6" stroke-linecap="round"/>
  <text x="1600" y="640" font-size="19" font-weight="700" fill="#8b4513">Fase (L)</text>
  <!-- NO -> foco -->
  <polyline points="1520,730 1640,730 1640,800" fill="none" stroke="#8b4513" stroke-width="6" stroke-linecap="round"/>
  <!-- neutro N -> foco -->
  <polyline points="1840,640 1840,860 1720,860 1720,840" fill="none" stroke="#0d6efd" stroke-width="6" stroke-linecap="round"/>
  <text x="1850" y="760" font-size="19" font-weight="700" fill="#0d6efd" transform="rotate(90 1850 760)">Neutro (N)</text>

  <!-- foco -->
  <g filter="url(#glow)">
    <circle cx="1680" cy="780" r="52" fill="#ffc107"/>
  </g>
  <rect x="1650" y="826" width="60" height="28" rx="4" fill="#868e96"/>
  <polyline points="1662,800 1672,770 1680,790 1688,770 1698,800" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="1680" y="895" font-size="22" font-weight="700" fill="#212529" text-anchor="middle">Foco 220V</text>

  <!-- ===================== TABLA Y NOTAS ===================== -->
  <rect x="80" y="960" width="1760" height="96" rx="14" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <g font-size="22" fill="#212529">
    <text x="110" y="1000"><tspan font-weight="700">D4</tspan> rojo · <tspan font-weight="700">D5</tspan> verde · <tspan font-weight="700">D6</tspan> azul · <tspan font-weight="700">D7</tspan> relé (foco 220V) · cada LED con resistencia de 220 Ω · relé por el contacto <tspan font-weight="700">NO</tspan> (normalmente abierto)</text>
    <text x="110" y="1038" fill="#6c757d">Para practicar sin 220V: LED amarillo + 220 Ω en D7 y RELAY_ACTIVE_LOW = false. El lado de 220V se cablea siempre desenchufado y solo por alguien con experiencia.</text>
  </g>
</svg>
